<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Super Hero Catch</title>
<style>
  :root {
    --sky-top: #5ec8ff;
    --sky-bottom: #c9f0ff;
    --ink: #1d2a4a;
    --card: #ffffff;
    --accent: #ff7a1a;
    --accent-dark: #d95f00;
    --good: #2bb673;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --card: #1f2a44; --ink: #f2f5ff; }
  }
  :root[data-theme="dark"] { --card: #1f2a44; --ink: #f2f5ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky-top); }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(29, 42, 74, .35);
  }
  .screen.hidden { display: none; }
  .card {
    background: var(--card); border-radius: 28px; padding: 24px 20px; width: min(420px, 100%);
    text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.12);
  }
  .hero-pic {
    width: 132px; height: 132px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px;
    border: 6px solid var(--accent); background: #ffe1b8;
  }
  h1 { margin: 4px 0 6px; font-size: 32px; line-height: 1.1; color: var(--accent-dark); }
  p { margin: 6px 0 14px; font-size: 17px; }
  .legend { display: flex; justify-content: center; gap: 14px; font-size: 26px; margin: 8px 0 14px; flex-wrap: wrap; }
  .legend span { display: flex; flex-direction: column; align-items: center; font-size: 13px; font-weight: bold; }
  .legend b { font-size: 30px; }
  button {
    font: inherit; font-size: 26px; font-weight: bold; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; padding: 14px 40px; box-shadow: 0 6px 0 var(--accent-dark);
    cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .small {
    font-size: 15px; padding: 8px 16px; background: #e8eefc; color: var(--ink); box-shadow: 0 3px 0 #c5d0ea; margin-top: 14px;
  }
  .small:active { box-shadow: 0 1px 0 #c5d0ea; }
  input[type=text] {
    font: inherit; font-size: 20px; text-align: center; width: 100%; padding: 10px; border-radius: 14px;
    border: 3px solid #d6def0; margin-bottom: 14px; color: #1d2a4a; background: #fff;
  }
  .score-big { font-size: 56px; font-weight: bold; color: var(--good); margin: 0; }
  .muted { opacity: .7; font-size: 15px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="screen" id="startScreen">
  <div class="card">
    <img class="hero-pic" id="startPic" alt="">
    <h1 id="titleText">Super Hero!</h1>
    <input type="text" id="nameInput" maxlength="14" placeholder="Hero's name">
    <p>Slide your finger to fly.<br>Catch the yummy things!</p>
    <div class="legend">
      <span><b>🍌</b>1</span><span><b>⚽</b>2</span><span><b>🐦</b>3</span><span><b>⭐</b>5</span><span><b>⛈️</b>Oops!</span>
    </div>
    <button id="playBtn">PLAY ▶</button><br>
    <button class="small" id="photoBtn">📷 Change hero photo</button>
    <input type="file" id="photoInput" accept="image/*" hidden>
  </div>
</div>

<div class="screen hidden" id="overScreen">
  <div class="card">
    <img class="hero-pic" id="overPic" alt="">
    <h1 id="overTitle">Great job!</h1>
    <p class="score-big" id="finalScore">0</p>
    <p class="muted" id="bestText"></p>
    <button id="againBtn">AGAIN ↻</button>
  </div>
</div>

<script>
(() => {
  // Embedded hero photo (data URL). Left empty in the public version; pick a photo in-game instead.
  const DEFAULT_FACE = "__FACE__";

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- hero face ----------
  const face = new Image();
  let faceReady = false;
  face.onload = () => { faceReady = true; };
  function setFace(src) {
    faceReady = false;
    if (src) { face.src = src; $("startPic").src = src; $("overPic").src = src; }
    else { $("startPic").src = cartoonFaceURL(); $("overPic").src = $("startPic").src; }
  }
  function cartoonFaceURL() {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d");
    g.fillStyle = "#ffd3a6"; g.beginPath(); g.arc(64, 64, 64, 0, 7); g.fill();
    g.fillStyle = "#6b4a2b"; g.beginPath(); g.arc(64, 40, 56, Math.PI, 0); g.fill();
    g.fillStyle = "#1d2a4a"; g.beginPath(); g.arc(44, 64, 7, 0, 7); g.arc(84, 64, 7, 0, 7); g.fill();
    g.strokeStyle = "#1d2a4a"; g.lineWidth = 6; g.lineCap = "round";
    g.beginPath(); g.arc(64, 78, 22, 0.2, Math.PI - 0.2); g.stroke();
    return c.toDataURL();
  }
  const savedFace = store.get("heroFace");
  setFace(savedFace || DEFAULT_FACE.startsWith("data:") && DEFAULT_FACE || "");
  const cartoon = new Image(); cartoon.src = cartoonFaceURL();

  $("photoBtn").onclick = () => $("photoInput").click();
  $("photoInput").onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      // center-square crop, 256px
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = c.height = 256;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2 * 0.6, s, s, 0, 0, 256, 256);
      const url = c.toDataURL("image/jpeg", 0.85);
      store.set("heroFace", url);
      setFace(url);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };

  // ---------- name ----------
  const nameInput = $("nameInput");
  nameInput.value = store.get("heroName") || "";
  function heroName() { return nameInput.value.trim() || "Hero"; }
  function updateTitle() { $("titleText").textContent = "Super " + heroName() + "!"; document.title = "Super " + heroName(); }
  nameInput.addEventListener("input", () => { store.set("heroName", nameInput.value.trim()); updateTitle(); });
  updateTitle();

  // ---------- sound ----------
  let actx = null;
  function beep(freq, dur, type = "sine", vol = 0.15, slide = 0) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, actx.currentTime + dur);
      g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    catch: () => beep(660, 0.12, "triangle", 0.2, 1.5),
    star: () => { beep(880, 0.1, "triangle", 0.2); setTimeout(() => beep(1320, 0.18, "triangle", 0.2), 90); },
    oops: () => beep(220, 0.35, "sawtooth", 0.08, 0.5),
    level: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, "square", 0.08), i * 110))
  };
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  // ---------- game state ----------
  const ITEMS = [
    { emoji: "🍌", pts: 1, w: 50 },
    { emoji: "⚽", pts: 2, w: 25 },
    { emoji: "🐦", pts: 3, w: 15 },
    { emoji: "⭐", pts: 5, w: 7 },
  ];
  const CLOUD = { emoji: "⛈️", bad: true };

  let state = "menu";
  let hero, items, pops, sparkles, score, lives, level, spawnT, time, hurtT, lastT, clouds;

  function reset() {
    hero = { x: W / 2, y: H * 0.74, tx: W / 2, r: Math.min(W, H) * 0.085 + 14, tilt: 0 };
    items = []; pops = []; sparkles = [];
    score = 0; lives = 3; level = 1; spawnT = 0; time = 0; hurtT = 0;
    clouds = Array.from({ length: 5 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * (H * 0.14), s: 0.6 + Math.random() * 0.8 }));
  }
  reset();

  function pickItem() {
    const badChance = Math.min(0.12 + level * 0.025, 0.3);
    if (time > 3 && Math.random() < badChance) return CLOUD;
    let r = Math.random() * ITEMS.reduce((a, b) => a + b.w, 0);
    for (const it of ITEMS) { if ((r -= it.w) < 0) return it; }
    return ITEMS[0];
  }

  function spawn() {
    const kind = pickItem();
    const size = Math.min(W, H) * 0.09 + 18;
    items.push({
      kind, size,
      x: size / 2 + Math.random() * (W - size),
      y: -size,
      vy: (H * 0.22) * (1 + (level - 1) * 0.13) * (0.8 + Math.random() * 0.4),
      wob: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 2
    });
  }

  // ---------- input ----------
  function pointer(e) {
    if (state !== "play") return;
    const t = e.touches ? e.touches[0] : e;
    if (t) hero.tx = t.clientX;
  }
  canvas.addEventListener("pointerdown", pointer);
  canvas.addEventListener("pointermove", pointer);
  canvas.addEventListener("touchstart", e => { pointer(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", e => { pointer(e); e.preventDefault(); }, { passive: false });
  const keys = {};
  window.addEventListener("keydown", e => keys[e.key] = true);
  window.addEventListener("keyup", e => keys[e.key] = false);

  // ---------- screens ----------
  function start() {
    resize(); reset();
    $("startScreen").classList.add("hidden");
    $("overScreen").classList.add("hidden");
    state = "play"; beep(523, 0.1, "triangle", 0.15);
  }
  $("playBtn").onclick = start;
  $("againBtn").onclick = start;

  function gameOver() {
    state = "over";
    const best = Math.max(score, +(store.get("heroBest") || 0));
    store.set("heroBest", best);
    $("finalScore").textContent = score;
    $("overTitle").textContent = score >= best && score > 0 ? "New record, " + heroName() + "! 🏆" : "Great job, " + heroName() + "!";
    $("bestText").textContent = "Best: " + best;
    setTimeout(() => $("overScreen").classList.remove("hidden"), 600);
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    clouds.forEach(c => { c.x += dt * 12 * c.s; if (c.x > W + 120) c.x = -120; });
    if (state !== "play") return;

    if (keys.ArrowLeft) hero.tx -= 600 * dt;
    if (keys.ArrowRight) hero.tx += 600 * dt;
    hero.tx = Math.max(hero.r, Math.min(W - hero.r, hero.tx));
    const prevX = hero.x;
    hero.x += (hero.tx - hero.x) * Math.min(1, dt * 12);
    hero.tilt += (((hero.x - prevX) / Math.max(dt, 0.001)) * 0.0006 - hero.tilt) * Math.min(1, dt * 8);
    hero.tilt = Math.max(-0.35, Math.min(0.35, hero.tilt));
    hero.y = H * 0.74 + Math.sin(time * 4) * 6;
    if (hurtT > 0) hurtT -= dt;

    const newLevel = 1 + Math.floor(score / 25);
    if (newLevel > level) { level = newLevel; sfx.level(); pops.push({ x: W / 2, y: H * 0.35, text: "Level " + level + "!", t: 0, big: true }); }

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.1 - level * 0.08) * (0.7 + Math.random() * 0.6); }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.wob += dt * 3;
      const ix = it.x + Math.sin(it.wob) * 10;
      const dx = ix - hero.x, dy = it.y - hero.y;
      if (Math.hypot(dx, dy) < hero.r + it.size * 0.38) {
        items.splice(i, 1);
        if (it.kind.bad) {
          if (hurtT <= 0) { lives--; hurtT = 1.2; sfx.oops(); buzz(150); pops.push({ x: ix, y: it.y, text: "Oops!", t: 0, bad: true }); }
          if (lives <= 0) gameOver();
        } else {
          score += it.kind.pts;
          it.kind.pts >= 5 ? sfx.star() : sfx.catch();
          pops.push({ x: ix, y: it.y, text: "+" + it.kind.pts, t: 0 });
          for (let k = 0; k < 10; k++) sparkles.push({ x: ix, y: it.y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .8) * 300, t: 0, c: `hsl(${Math.random() * 360},90%,60%)` });
        }
        continue;
      }
      if (it.y > H + it.size) items.splice(i, 1);
    }
    pops.forEach(p => p.t += dt); pops = pops.filter(p => p.t < (p.big ? 1.6 : 0.9));
    sparkles.forEach(s => { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 600 * dt; });
    sparkles = sparkles.filter(s => s.t < 0.7);
  }

  // ---------- draw ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#5ec8ff"); g.addColorStop(1, "#c9f0ff");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    clouds.forEach(c => {
      const s = 40 * c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, s, 0, 7); ctx.arc(c.x + s, c.y - s * .4, s * 1.1, 0, 7); ctx.arc(c.x + s * 2, c.y, s * .9, 0, 7);
      ctx.fill();
    });
    // hills
    ctx.fillStyle = "#7ed957";
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, H * 0.92 + Math.sin(x * 0.012) * 14);
    ctx.lineTo(W + 20, H); ctx.fill();
    ctx.fillStyle = "#5bbf3a";
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, H * 0.96 + Math.sin(x * 0.02 + 2) * 10);
    ctx.lineTo(W + 20, H); ctx.fill();
  }

  function drawHero() {
    const { x, y, r } = hero;
    if (hurtT > 0 && Math.floor(hurtT * 10) % 2 === 0) return; // blink when hurt
    ctx.save();
    ctx.translate(x, y); ctx.rotate(hero.tilt);
    // cape
    const flap = Math.sin(time * 10) * r * 0.15;
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, r * 0.75);
    ctx.quadraticCurveTo(-r * 1.3 - hero.tilt * r * 2, r * 1.8 + flap, -r * 0.9, r * 2.4 + flap);
    ctx.lineTo(r * 0.9, r * 2.4 - flap);
    ctx.quadraticCurveTo(r * 1.3 - hero.tilt * r * 2, r * 1.8 - flap, r * 0.55, r * 0.75);
    ctx.fill();
    // body (orange shirt like his school uniform)
    ctx.fillStyle = "#ff7a1a";
    ctx.beginPath(); ctx.ellipse(0, r * 1.45, r * 0.62, r * 0.75, 0, 0, 7); ctx.fill();
    // star emblem
    ctx.fillStyle = "#ffd93d"; ctx.font = `${r * 0.6}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("★", 0, r * 1.4);
    // arms up
    ctx.strokeStyle = "#ffd3a6"; ctx.lineWidth = r * 0.22; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 1.1); ctx.lineTo(-r * 1.05, r * 0.6 + flap * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.5, r * 1.1); ctx.lineTo(r * 1.05, r * 0.6 - flap * 0.5); ctx.stroke();
    // head (photo)
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, 7); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
    const img = faceReady ? face : cartoon;
    if (img.complete && img.naturalWidth) ctx.drawImage(img, -r, -r, r * 2, r * 2);
    ctx.restore();
    ctx.lineWidth = 4; ctx.strokeStyle = "#ff7a1a";
    ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.stroke();
    ctx.restore();
  }

  function drawItems() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    items.forEach(it => {
      ctx.save();
      ctx.translate(it.x + Math.sin(it.wob) * 10, it.y);
      ctx.rotate(it.kind.bad ? 0 : Math.sin(it.wob) * 0.3 * it.spin);
      ctx.font = `${it.size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(it.kind.emoji, 0, 0);
      ctx.restore();
    });
  }

  function drawFx() {
    sparkles.forEach(s => {
      ctx.globalAlpha = 1 - s.t / 0.7; ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    pops.forEach(p => {
      const life = p.big ? 1.6 : 0.9;
      ctx.globalAlpha = 1 - p.t / life;
      ctx.font = `bold ${p.big ? 48 : 30}px "Trebuchet MS", sans-serif`;
      ctx.textAlign = "center"; ctx.lineWidth = 6; ctx.strokeStyle = "#fff";
      ctx.fillStyle = p.bad ? "#7a5cff" : p.big ? "#ff7a1a" : "#2bb673";
      const yy = p.y - p.t * 60;
      ctx.strokeText(p.text, p.x, yy); ctx.fillText(p.text, p.x, yy);
    });
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    if (state === "menu") return;
    const top = 14;
    ctx.textBaseline = "top"; ctx.lineWidth = 6; ctx.strokeStyle = "#fff";
    ctx.font = 'bold 34px "Trebuchet MS", sans-serif'; ctx.textAlign = "left";
    ctx.fillStyle = "#1d2a4a";
    ctx.strokeText("⭐ " + score, 16, top); ctx.fillText("⭐ " + score, 16, top);
    ctx.textAlign = "right"; ctx.font = '30px sans-serif';
    ctx.fillText("❤️".repeat(Math.max(lives, 0)) + "🤍".repeat(3 - Math.max(lives, 0)), W - 16, top + 2);
    ctx.textAlign = "center"; ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
    ctx.strokeText("Super " + heroName() + " · Level " + level, W / 2, top + 48);
    ctx.fillText("Super " + heroName() + " · Level " + level, W / 2, top + 48);
  }

  function frame(t) {
    const now = t / 1000;
    const dt = Math.min(0.05, lastT ? now - lastT : 0);
    lastT = now;
    update(dt);
    drawBackground();
    drawItems();
    if (state !== "menu") drawHero();
    drawFx();
    drawHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
